name: Build UniWRT Packages

# Why this works where the previous version failed:
#   The earlier workflow pinned openwrt/gh-action-sdk@v6, whose entrypoint
#   mishandled the directory layout of the current SDK images and aborted with
#   "sed: can't read feeds.conf.default" before it could register the repo as a
#   feed. Using @main (current entrypoint) plus SDK image tags that are actually
#   published for each release fixes it.
#
# Package format follows the SDK branch:
#   23.05 / 24.10  -> opkg -> .ipk
#   25.12+         -> apk  -> .apk
# The theme is arch-independent (LUCI_PKGARCH:=all), so one arch per release
# produces the universal package.

env:
  PACKAGE: luci-theme-uniwrt
  FEEDNAME: uniwrt
  THEME_RELEASE: ${{ github.run_number }}

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'luci-theme-uniwrt/**'
      - '.github/workflows/build.yml'
      - 'qa-static.sh'
      - 'uniwrt-apply.sh'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
  pull_request:
    paths:
      - 'luci-theme-uniwrt/**'
      - '.github/workflows/build.yml'
      - 'qa-static.sh'
      - 'uniwrt-apply.sh'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: uniwrt-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  qa:
    name: Static QA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs python3-yaml

      - name: Run static QA
        run: bash ./qa-static.sh

  build:
    name: Build ${{ matrix.label }}
    needs: qa
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '23.05.6'
            arch: x86_64-23.05.6
            extension: ipk
            label: 'legacy .ipk for OpenWrt 23.05.x'
          - release: '24.10.6'
            arch: x86_64-24.10.6
            extension: ipk
            label: 'current .ipk for OpenWrt 24.10.x'
            standalone: true
          - release: '25.12.4'
            arch: x86_64-25.12.4
            extension: apk
            label: 'modern .apk for OpenWrt 25.12.x+'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: ${{ env.FEEDNAME }}
          PACKAGES: ${{ env.PACKAGE }}
          THEME_RELEASE: ${{ env.THEME_RELEASE }}
          V: s

      - name: Collect package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find "$GITHUB_WORKSPACE/bin" -type f -name "${PACKAGE}*.${{ matrix.extension }}" -print -exec cp -v {} dist/ \;
          echo "Built package list:"
          find dist -maxdepth 1 -type f -printf '%f\n' | sort
          test "$(find dist -maxdepth 1 -type f -name "*.${{ matrix.extension }}" | wc -l)" -ge 1 || {
            echo "::error::No ${PACKAGE} .${{ matrix.extension }} package was produced for OpenWrt ${{ matrix.release }}"
            exit 1
          }

      - name: Build standalone archive
        if: matrix.standalone
        shell: bash
        run: |
          set -euo pipefail
          ipk="$(find dist -maxdepth 1 -name "${PACKAGE}_*.ipk" | head -n1)"
          sh scripts/make-standalone.sh "$ipk" dist/luci-theme-uniwrt-standalone.tar.gz
          tar -tzvf dist/luci-theme-uniwrt-standalone.tar.gz

      - name: Test uniwrt-apply.sh against the standalone archive
        if: matrix.standalone
        shell: bash
        run: |
          sudo apt-get install -y busybox >/dev/null
          bash tests/test-apply.sh dist/luci-theme-uniwrt-standalone.tar.gz

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-${{ matrix.release }}-${{ matrix.extension }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for release helper)
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.ipk' -o -name '*.apk' -o -name '*-standalone.tar.gz' \) -print -exec cp -v {} release/ \;
          test -f release/luci-theme-uniwrt-standalone.tar.gz || {
            echo "::error::Standalone archive missing"; exit 1; }
          cp -v uniwrt-apply.sh release/
          test "$(find release -type f \( -name '*.ipk' -o -name '*.apk' \) | wc -l)" -ge 1 || {
            echo "::error::No package assets found"; exit 1; }
          ( cd release && sha256sum -- * > SHA256SUMS )
          ls -la release

      - name: Decide what to publish
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          VER="$(tr -d '[:space:]' < luci-theme-uniwrt/ucode/template/themes/uniwrt/version)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Manual tag push: publish exactly that tag.
            [ "${GITHUB_REF_NAME}" = "v${VER}" ] || \
              echo "::warning::Tag ${GITHUB_REF_NAME} does not match package version ${VER}"
            printf 'nightly=false\nversioned=true\ntag=%s\n' "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Branch push: always refresh the rolling nightly.
          echo "nightly=true" >> "$GITHUB_OUTPUT"

          # On the default branch, a version that has no release tag yet is a
          # new release: publish v<version> automatically and mark it Latest.
          if [ "${GITHUB_REF}" = "refs/heads/${{ github.event.repository.default_branch }}" ] \
             && ! git ls-remote --exit-code --tags origin "refs/tags/v${VER}" >/dev/null; then
            echo "New version ${VER} detected - publishing release v${VER}"
            printf 'versioned=true\ntag=v%s\n' "${VER}" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${VER} is already released - nightly only"
            echo "versioned=false"  >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ### Install (recommended): standalone

          Run on the router — works on OpenWrt 23.05, 24.10 and 25.12:

          ```sh
          wget -O /tmp/uniwrt-apply.sh https://github.com/ox1d3x3/uniwrt-luci/releases/latest/download/uniwrt-apply.sh
          sh /tmp/uniwrt-apply.sh
          ```

          The standalone install is not registered as a package, so **Attended Sysupgrade keeps working**,
          and the theme is carried into the new firmware when *Keep settings* is on. Run the same
          commands again to update; `sh /tmp/uniwrt-apply.sh --uninstall` removes it.

          ### Install as a package

          Pick by **OpenWrt version**, not router CPU — the package is architecture-independent.

          | OpenWrt version | Package manager | Asset |
          |---:|:---:|:---|
          | 25.12.x and newer | apk | `luci-theme-uniwrt-*.apk` |
          | 24.10.x | opkg | `luci-theme-uniwrt_*-r1_all.ipk` |
          | 23.05.x | opkg | `luci-theme-uniwrt_*_all.ipk` (no `-r1`) |

          ```sh
          apk add --allow-untrusted ./luci-theme-uniwrt-*.apk      # 25.12+
          opkg install ./luci-theme-uniwrt_*_all.ipk               # 23.05 / 24.10
          ```

          > A package install blocks Attended Sysupgrade (“Impossible package selection”) — see the README FAQ.

          After installing or upgrading, do one hard refresh in the browser (Ctrl+Shift+R).
          NOTES

      - name: Reset rolling nightly release
        if: steps.plan.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete nightly --yes --cleanup-tag || true

      - name: Publish nightly
        if: steps.plan.outputs.nightly == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly build #${{ github.run_number }} (${{ steps.plan.outputs.version }})
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release/*
          body_path: release-notes.md

      - name: Publish versioned release
        if: steps.plan.outputs.versioned == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: UniWRT Portal ${{ steps.plan.outputs.tag }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
          body_path: release-notes.md
